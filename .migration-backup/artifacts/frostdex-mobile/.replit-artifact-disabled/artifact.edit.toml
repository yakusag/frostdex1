kind = "mobile"
previewPath = "/mobile-backup/"
title = "FrostDex Mobile (Backup)"
version = "1.0.0"
id = "artifacts/frostdex-mobile-backup"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile-backup/" ]
localPort = 23457

[services.development]
run = "pnpm --filter @workspace/frostdex-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frostdex-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/frostdex-mobile", "run", "serve" ]

[services.env]
PORT = "23457"
BASE_PATH = "/mobile-backup/"

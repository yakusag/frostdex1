kind = "web"
  previewPath = "/"
  title = "FrostDex"
  version = "1.0.0"
  id = "artifacts/frostdex"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 20570

  [services.development]
  run = "pnpm install --frozen-lockfile && pnpm --filter @workspace/frostdex run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/frostdex", "run", "build" ]
  publicDir = "artifacts/frostdex/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "20570"
  BASE_PATH = "/"
  
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = localStorage.getItem("frostdex_theme");
        document.documentElement.dataset.theme =
          savedTheme === "standard" || savedTheme === "extra"
            ? savedTheme
            : "frost";
        document.documentElement.dataset.ouiTheme =
          savedTheme === "standard" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "frost";
        document.documentElement.dataset.ouiTheme = "dark";
      }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#04061400" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />

    <title>FROSTAI BOT | FrostDex</title>

    <!-- speed: preconnect + prefetch critical origins -->
    <link rel="preconnect" href="https://api.orderly.org" crossorigin />
    <link rel="preconnect" href="https://api.groq.com" crossorigin />
    <link rel="preconnect" href="https://api.dexscreener.com" crossorigin />
    <link rel="preconnect" href="https://arb1.arbitrum.io" crossorigin />
    <link rel="preconnect" href="https://ws.orderly.org" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://arbiscan.io" />
    <link rel="dns-prefetch" href="https://api.coingecko.com" />
    <link rel="dns-prefetch" href="https://wss.orderly.org" />
    <link rel="dns-prefetch" href="https://static.orderly.org" />

    <style>
      /* ── base ── */
      #splash {
        --splash-logo-shadow: drop-shadow(0 0 40px rgba(56,224,248,0.55))
                              drop-shadow(0 0 16px rgba(14,203,129,0.45));
        --splash-logo-shadow-strong: drop-shadow(0 0 60px rgba(56,224,248,0.85))
                                     drop-shadow(0 0 24px rgba(14,203,129,0.65));
        --splash-tag: rgba(60,230,255,0.35);
        --splash-brand: linear-gradient(90deg, #38e0f8 0%, #0ecb81 100%);
        --splash-particle: rgba(60,230,255,0.55);
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: radial-gradient(ellipse at 50% 40%, #0d1219 0%, #0b0e11 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        overflow: hidden;
      }
      .brand-snowflake-crop {
        position: relative;
        flex: none;
        aspect-ratio: 1;
        overflow: hidden;
      }
      .brand-snowflake-crop > img {
        position: absolute;
        top: -218%;
        left: 0;
        display: block;
        width: 532%;
        max-width: none;
        height: auto;
      }
      #splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      html[data-theme="standard"] #splash {
        --splash-logo-shadow: drop-shadow(0 0 40px rgba(240,185,11,0.32))
                              drop-shadow(0 0 16px rgba(252,213,53,0.24));
        --splash-logo-shadow-strong: drop-shadow(0 0 60px rgba(240,185,11,0.55))
                                     drop-shadow(0 0 24px rgba(252,213,53,0.4));
        --splash-tag: rgba(112,122,138,0.8);
        --splash-brand: linear-gradient(90deg, #c99400 0%, #f0b90b 100%);
        --splash-particle: rgba(201,148,0,0.42);
        background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #f5f5f5 70%);
      }
      html[data-theme="extra"] #splash {
        --splash-logo-shadow: drop-shadow(0 0 40px rgba(240,185,11,0.42))
                              drop-shadow(0 0 16px rgba(255,229,138,0.3));
        --splash-logo-shadow-strong: drop-shadow(0 0 60px rgba(240,185,11,0.7))
                                     drop-shadow(0 0 24px rgba(255,229,138,0.5));
        --splash-tag: rgba(240,185,11,0.5);
        --splash-brand: linear-gradient(90deg, #f0b90b 0%, #ffe58a 52%, #f0b90b 100%);
        --splash-particle: rgba(240,185,11,0.45);
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── logo ── */
      #splash-flake {
        display: block;
        width: clamp(120px, 20vw, 168px);
        height: clamp(120px, 20vw, 168px);
        max-width: min(80vw, 168px);
        align-self: center;
        margin: 0;
        filter: var(--splash-logo-shadow);
        animation: flake-appear 0.7s cubic-bezier(0.34,1.56,0.64,1) both,
                   flake-pulse 3.5s ease-in-out 0.7s infinite;
      }
      @keyframes flake-appear {
        from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes flake-pulse {
        0%, 100% { filter: var(--splash-logo-shadow); transform: scale(1); }
        50%      { filter: var(--splash-logo-shadow-strong); transform: scale(1.05); }
      }
      @keyframes name-appear {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── brand name ── */
      #splash-name {
        position: relative;
        display: block;
        flex: none;
        width: clamp(230px, 64vw, 360px);
        aspect-ratio: 780 / 145;
        overflow: hidden;
        animation: name-appear 0.6s ease 0.45s both;
      }
      #splash-name > img {
        position: absolute;
        top: -313%;
        left: -28.2%;
        display: block;
        width: 131.3%;
        max-width: none;
        height: auto;
      }

      /* ── tagline ── */
      #splash-tag {
        margin-top: 18px;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--splash-tag);
        animation: name-appear 0.6s ease 0.6s both;
      }
      #splash-motto {
        margin-top: 6px;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: var(--splash-brand);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: name-appear 0.6s ease 0.9s both;
      }
      html[data-theme="extra"] #splash-motto,
      html[data-theme="extra"] #splash-tag {
        background: var(--splash-brand);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Installed apps should open on the site, not on the web splash screen. */
      @media (display-mode: standalone), (display-mode: fullscreen) {
        #splash {
          display: none !important;
        }
      }

      /* ── falling snowflakes ── */
      #splash-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .sp {
        position: absolute;
        color: var(--splash-particle);
        font-size: 14px;
        user-select: none;
        animation: sp-fall linear infinite;
      }
      @keyframes sp-fall {
        0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 0.4; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <!-- splash screen -->
    <div id="splash">
      <div id="splash-particles"></div>
      <div id="splash-brand">
        <div id="splash-flake" class="brand-snowflake-crop" aria-hidden="true">
          <img src="/logo.webp" alt="" />
        </div>
        <div id="splash-name" role="img" aria-label="FROSTDEX">
          <img src="/logo.webp" alt="" />
        </div>
      </div>
      <div id="splash-tag">Decentralized Exchange</div>
      <div id="splash-motto">FREEDOM &bull; TRUST &bull; TRADE</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>

    <script>
      /* generate falling snowflakes */
      (function () {
        if (window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches) {
          return;
        }
        var container = document.getElementById('splash-particles');
        var flakes = ['❄', '❅', '❆', '✦', '·'];
        for (var i = 0; i < 22; i++) {
          var p = document.createElement('div');
          p.className = 'sp';
          var size = Math.random() * 14 + 8;
          p.textContent = flakes[Math.floor(Math.random() * flakes.length)];
          p.style.cssText = [
            'font-size:' + size + 'px',
            'left:' + Math.random() * 100 + '%',
            'animation-duration:' + (Math.random() * 8 + 6) + 's',
            'animation-delay:' + (Math.random() * 6) + 's',
            'opacity:' + (Math.random() * 0.4 + 0.2)
          ].join(';');
          container.appendChild(p);
        }
      })();

      /* hide splash once React has mounted */
      window.__hideSplash = function () {
        var s = document.getElementById('splash');
        if (s) {
          s.classList.add('hidden');
          setTimeout(function () { s.remove(); }, 600);
        }
      };
    </script>
  </body>
</html>
